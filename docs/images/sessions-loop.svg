<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" role="img" aria-labelledby="t d">
<title id="t">A session, then a flow</title>
<desc id="d">open shows a screen and returns a response: the new screenshot, the log lines since the last one, and what is on screen with refs. act runs steps and returns the next response, as often as needed. close --save keeps the steps that worked as a flow file; added to a profile’s targets, facetshot -p release replays it on every device.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:#1e1d1b}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.s{fill:#4a4741}.u{fill:#67635b}.a{fill:#5b2fd6}
.b{fill:#1e1d1b;fill-opacity:.03;stroke:#d3cec4;stroke-width:1.25}
.ab{fill:#5b2fd6;fill-opacity:.06;stroke:#5b2fd6;stroke-width:1.5}
.bl{fill:none;stroke:#d3cec4;stroke-width:1.25}
.l{stroke:#67635b;stroke-width:1.5;fill:none}
.al{stroke:#5b2fd6;stroke-width:2;fill:none}
.h{fill:#67635b}.ah{fill:#5b2fd6}
.cl{fill:#ffffff;stroke:#c9c3b8;stroke-width:1}
.cd{fill:#3a3834;stroke:#3a3834;stroke-width:1}
.r{stroke:#c43a22;stroke-width:2.5;fill:none}.rt{fill:#c43a22}.rf{fill:#c43a22}.bt{fill:#ffffff}
@media (prefers-color-scheme:dark){
text{fill:#ece8e0}.s{fill:#cfcac0}.u{fill:#a8a398}.a{fill:#8f82d8}
.b{fill:#ffffff;fill-opacity:.04;stroke:#55514a}
.ab{fill:#8f82d8;fill-opacity:.12;stroke:#8f82d8}
.bl{stroke:#55514a}.l{stroke:#a8a398}.al{stroke:#8f82d8}.h{fill:#a8a398}.ah{fill:#8f82d8}
.cl{fill:#ebe7df;stroke:#ebe7df}.cd{fill:#151413;stroke:#6a665e}
.r{stroke:#ec7a63}.rt{fill:#ec7a63}.rf{fill:#ec7a63}.bt{fill:#1d1c1a}
}
</style>
<defs>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="h"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
</defs>
<rect x="10" y="62" width="150" height="64" rx="6" class="b"/>
<text x="24" y="88" class="m">open /settings</text>
<text x="24" y="110" class="m u">--on phone</text>
<path d="M160,94 H206" class="al" marker-end="url(#ah)"/>
<rect x="210" y="20" width="262" height="148" rx="8" class="ab"/>
<text x="226" y="46" class="m a">each response</text>
<text x="226" y="76">the new screenshot</text>
<text x="226" y="100">the log lines since the last one</text>
<text x="226" y="124">what’s on screen, with refs</text>
<text x="226" y="148" class="m u" font-size="11.5">e14 textbox "Name" @195,222</text>
<path d="M472,74 H556" class="al" marker-end="url(#ah)"/>
<path d="M560,116 H476" class="al" marker-end="url(#ah)"/>
<rect x="560" y="50" width="192" height="88" rx="6" class="b"/>
<text x="574" y="76" class="m">act s-42cb1d</text>
<text x="574" y="98" class="m u" font-size="11.5">fill:e14=Grace Hopper</text>
<text x="574" y="118" class="m u" font-size="11.5">click:e18</text>
<text x="516" y="64" class="u" font-size="12" text-anchor="middle">steps</text>
<text x="516" y="136" class="u" font-size="12" text-anchor="middle">response</text>
<path d="M300,168 C300,200 77,190 77,226" class="l" marker-end="url(#h)"/>
<rect x="7" y="230" width="140" height="64" rx="6" class="b"/>
<text x="19" y="256" class="m">close --save</text>
<text x="19" y="280" class="s" font-size="13">keeps what worked</text>
<rect x="177" y="230" width="204" height="64" rx="6" class="b"/>
<text x="189" y="256" class="m">flows/edit-settings.yaml</text>
<text x="189" y="280" class="s" font-size="13">a flow file</text>
<path d="M147,262 H173" class="l" marker-end="url(#h)"/>
<rect x="411" y="230" width="140" height="64" rx="6" class="b"/>
<text x="423" y="256" class="m">targets: [ … ]</text>
<text x="423" y="280" class="s" font-size="13">added to a profile</text>
<path d="M381,262 H407" class="l" marker-end="url(#h)"/>
<rect x="581" y="230" width="172" height="64" rx="6" class="b"/>
<text x="593" y="256" class="m">facetshot -p release</text>
<text x="593" y="280" class="s" font-size="13">on every device</text>
<path d="M551,262 H577" class="l" marker-end="url(#h)"/>
</svg>
