<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="t d">
<title id="t">facetshot</title>
<desc id="d">One command pictures a page on desktop, tablet and phone in light, dark and large text, and lists what looks broken, with the logs.</desc>
<style>text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mono{white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect width="1280" height="660" rx="28" fill="#11141b"/>
<text x="64" y="96" font-size="46" font-weight="700" fill="#f4f1ea">facetshot</text>
<text x="64" y="134" font-size="20" fill="#a3abb9">Every screen, on every device, in every mode: one command, for you and your coding agent.</text>
<rect x="64" y="176" width="470" height="360" rx="14" fill="#0a0c11" stroke="#262b36"/>
<circle cx="86" cy="196" r="5.5" fill="#ff5f57"/>
<circle cx="104" cy="196" r="5.5" fill="#febc2e"/>
<circle cx="122" cy="196" r="5.5" fill="#28c840"/>
<text class="mono" x="86" y="238" font-size="15" fill="#f4f1ea">$ facetshot /pricing \</text>
<text class="mono" x="86" y="262" font-size="15" fill="#f4f1ea">    --on desktop,tablet-portrait,phone \</text>
<text class="mono" x="86" y="286" font-size="15" fill="#f4f1ea">    --as light,dark,large</text>
<text class="mono" x="86" y="334" font-size="15" fill="#a3abb9">9/9 pictures · 3 devices × 3 variants · 2.2s</text>
<text class="mono" x="86" y="382" font-size="15" fill="#ff7b72">✗ overflow  page 498px wider than the screen</text>
<text class="mono" x="86" y="406" font-size="15" fill="#f2cc60">! clipped   &quot;Shared notebooks for teams&quot;</text>
<text class="mono" x="86" y="454" font-size="15" fill="#a3abb9">Sheets:  pricing.sheet.jpg</text>
<text class="mono" x="86" y="478" font-size="15" fill="#a3abb9">Logs:    logs.txt, logs.ndjson</text>
