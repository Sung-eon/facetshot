<!doctype html>
<html lang="en">
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Fixture</title>
	<style>
		:root {
			color-scheme: light dark;
			--bg: #fff;
			--fg: #111;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #111;
				--fg: #eee;
			}
		}
		body {
			margin: 0;
			font: 1rem/1.5 system-ui;
			background: var(--bg);
			color: var(--fg);
		}
		header {
			display: flex;
			gap: 1rem;
			padding: 1rem;
			border-bottom: 1px solid #8884;
		}
		.card {
			margin: 1rem;
			padding: 1rem;
			border: 1px solid #8886;
			border-radius: 12px;
		}
		.name {
			width: 8rem;
			overflow: hidden;
			white-space: nowrap;
		}
		.wide {
			width: 1200px;
			height: 8px;
			background: #e11d48;
		}
		.spinner {
			width: 2rem;
			height: 2rem;
			background: #888;
		}
		@media (min-width: 900px) {
			.wide {
				display: none;
			}
		}
		/* Screen-reader text, as documentation themes write it: never a finding. */
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			clip-path: inset(50%);
			white-space: nowrap;
			border-width: 0;
		}
		button.tiny {
			width: 16px;
			height: 16px;
			padding: 0;
		}
	</style>
	<header>
		<a class="sr-only" href="#main">Skip to the content</a>
		<strong>Fixture</strong><a href="/second.html">Second</a
		><button class="tiny" aria-label="x">×</button
		><span class="sr-only"
			>Read aloud only, and far too long to fit on any phone screen at all</span
		>
	</header>
	<div class="spinner" id="spinner"></div>
	<main class="card">
		<h1>Hello there</h1>
		<p class="name">A rather long name that will not fit in its box</p>
		<div class="wide"></div>
		<p id="late"></p>
	</main>
	<script>
		setTimeout(() => {
			document.getElementById('spinner').remove();
			document.getElementById('late').textContent = 'Loaded after a moment.';
		}, 400);
	</script>
</html>
